<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello Kitty Photobooth 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #ffdeea;
            background-image: radial-gradient(#fff0f5 2px, transparent 2px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 94%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(214,19,108,0.15), inset 0 0 0 5px #ffb7c5;
            position: relative;
            z-index: 10;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 32px; font-weight: 900; color: #df2b76; text-shadow: 2px 2px 0 #fff; line-height: 1.1; margin-bottom: 5px; }
        .header p { display: inline-block; background: #fff0f5; color: #d6136c; font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 20px; border: 2px dashed #ffb7c5; }

        /* Khung hiển thị Camera UI */
        .viewport {
            width: 100%;
            aspect-ratio: 3/4;
            background: #ffe5ef;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(248,81,153,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fff;
            outline: 3px dashed #ffb7c5;
            margin-bottom: 25px;
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #resultImg { width: 100%; height: 100%; object-fit: contain; display: none; background: #ffdeea; }
        
        .cam-badge {
            position: absolute; top: 12px; left: 12px;
            background: #fff; color: #df2b76; font-size: 11px; font-weight: 900;
            padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid #ffdeea; z-index: 5;
        }
        .cam-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #45c97b; box-shadow: 0 0 0 3px rgba(69,201,123,0.2); }

        #loading-msg { position: absolute; z-index: 2; color: #df2b76; font-weight: 800; font-size: 14px; text-align: center; }

        /* Nút bấm */
        .controls { display: flex; gap: 12px; width: 100%; }
        .btn {
            border: none; border-radius: 24px; font-size: 17px; font-weight: 900;
            padding: 20px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-capture {
            width: 100%; background: linear-gradient(135deg, #ff7eb3, #ff1493); color: white;
            box-shadow: 0 8px 0 #d91e69, 0 15px 25px rgba(248,81,153,0.3);
        }
        .btn-capture:active { transform: translateY(6px); box-shadow: 0 2px 0 #d91e69; }
        .btn-capture:disabled { background: #f4c2d7; box-shadow: 0 8px 0 #dca4bc; color: #fff; cursor: wait; }

        .btn-retake { flex: 4; background: #fff; color: #df2b76; border: 3px solid #df2b76; box-shadow: 0 6px 0 #df2b76; }
        .btn-retake:active { transform: translateY(4px); box-shadow: 0 2px 0 #df2b76; }
        .btn-save { flex: 6; background: linear-gradient(135deg, #ff7eb3, #ff1493); color: white; box-shadow: 0 6px 0 #d91e69; }
        .btn-save:active { transform: translateY(4px); box-shadow: 0 2px 0 #d91e69; }

        .controls-result { display: none; width: 100%; gap: 12px; }
        
        /* Cảnh báo in-app browser */
        #browser-warning { display: none; position: fixed; inset: 0; background: #ffdeea; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .warning-card { background: #fff; padding: 30px; border-radius: 24px; text-align: center; box-shadow: 0 20px 40px rgba(214,19,108,0.15); border: 4px dashed #ffb7c5; }
    </style>
</head>
<body>

<div id="browser-warning">
    <div class="warning-card">
        <h3 style="color: #df2b76; font-size: 22px; margin-bottom: 15px;">⚠️ Mở Trình Duyệt Ngoài</h3>
        <p style="color: #666; font-weight: 700; line-height: 1.6;">
            Hãy bấm vào nút <b style="color:#df2b76;">(···)</b> ở góc màn hình<br>
            và chọn <b>"Mở bằng trình duyệt"</b> để chụp ảnh nhé!
        </p>
    </div>
</div>

<div class="app-container">
    <div class="header">
        <h1>Hello Kitty</h1>
        <p>🎀 Chu môi lên mình chụp cho nè 🎀</p>
    </div>

    <div class="viewport">
        <div class="cam-badge">CAMERA</div>
        <div id="loading-msg">Đang bật máy ảnh...</div>
        <video id="preview" autoplay playsinline muted></video>
        <img id="resultImg" alt="Photo" />
    </div>

    <button class="btn btn-capture" id="startBtn">📸 CHỤP ẢNH NÈ</button>
    
    <div class="controls-result" id="resultControls">
        <button class="btn btn-retake" id="retakeBtn">🔄 LẠI</button>
        <button class="btn btn-save" id="saveBtn">💖 LƯU ẢNH</button>
    </div>
</div>

<script src="main.js"></script>
<script>
    // Kiểm tra In-app browser
    if (/TikTok|FBAN|FBAV|Zalo|Instagram/i.test(navigator.userAgent)) {
        document.getElementById('browser-warning').style.display = 'flex';
        document.querySelector('.app-container').style.display = 'none';
    }

    const video = document.getElementById('preview');
    const startBtn = document.getElementById('startBtn');
    const resultImg = document.getElementById('resultImg');
    const resultControls = document.getElementById('resultControls');
    const msg = document.getElementById('loading-msg');
    
    let rawImageBase64 = null;

    startBtn.addEventListener('click', async () => {
        const vw = video.videoWidth || 720;
        const vh = video.videoHeight || 960;

        if (vw > 0) {
            // Memory Snapshot: Chụp ngay lập tức trước khi main.js tắt luồng
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = vw;
            tempCanvas.height = vh;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.translate(vw, 0);
            tCtx.scale(-1, 1);
            tCtx.drawImage(video, 0, 0, vw, vh);
            rawImageBase64 = tempCanvas.toDataURL('image/jpeg', 1.0);
        }

        // Cập nhật UI
        startBtn.disabled = true;
        startBtn.innerHTML = "✨ ĐANG RỬA ẢNH...";

        // Chạy Tracking System của main.js
        if (typeof runTrackingSystem === 'function') {
            await runTrackingSystem();
        }

        // Xử lý đồ họa Photobooth
        if (rawImageBase64) {
            await processPhotoboothGraphic(rawImageBase64);
        }
    });

    // Hệ thống vẽ Vector Hello Kitty (Canvas API)
    function drawKittyVector(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Viền và đổ bóng
        ctx.shadowColor = "rgba(0,0,0,0.15)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        // Tai
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(-60, -20); ctx.lineTo(-80, -90); ctx.lineTo(-10, -60); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(60, -20); ctx.lineTo(80, -90); ctx.lineTo(10, -60); ctx.fill(); ctx.stroke();

        // Mặt
        ctx.beginPath(); ctx.ellipse(0, 0, 105, 75, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        
        ctx.shadowColor = "transparent"; // Tắt bóng cho chi tiết nhỏ

        // Mắt
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.ellipse(-45, 10, 8, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(45, 10, 8, 13, 0, 0, Math.PI * 2); ctx.fill();

        // Mũi
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.ellipse(0, 25, 12, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Râu mèo
        const drawWhisker = (wx1, wy1, wx2, wy2) => { ctx.beginPath(); ctx.moveTo(wx1, wy1); ctx.lineTo(wx2, wy2); ctx.stroke(); };
        drawWhisker(-105, 0, -145, -10); drawWhisker(-105, 15, -145, 15); drawWhisker(-100, 30, -140, 40);
        drawWhisker(105, 0, 145, -10); drawWhisker(105, 15, 145, 15); drawWhisker(100, 30, 140, 40);

        // Nơ đỏ
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.ellipse(30, -55, 30, 22, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(80, -40, 30, 22, -Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(55, -45, 18, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    async function processPhotoboothGraphic(base64Src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Độ phân giải cao (In ấn chuẩn)
                const CANVAS_W = 1200;
                const CANVAS_H = 1600;
                canvas.width = CANVAS_W;
                canvas.height = CANVAS_H;

                // 1. Tạo Pattern nền chấm bi hồng
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 40; pCanvas.height = 40;
                const pCtx = pCanvas.getContext('2d');
                pCtx.fillStyle = '#ffb7c5'; pCtx.fillRect(0, 0, 40, 40);
                pCtx.fillStyle = '#ffffff';
                pCtx.beginPath(); pCtx.arc(10, 10, 4, 0, Math.PI*2); pCtx.fill();
                pCtx.beginPath(); pCtx.arc(30, 30, 4, 0, Math.PI*2); pCtx.fill();
                ctx.fillStyle = ctx.createPattern(pCanvas, 'repeat');
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // 2. Tọa độ khung ảnh trắng (Polaroid effect)
                const marginX = 80;
                const marginYTop = 150;
                const photoW = CANVAS_W - (marginX * 2); // 1040
                const photoH = Math.floor(photoW * (4/3)); // 1386.6 -> Tỷ lệ 3:4
                
                // Viền trắng Polaroid
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.shadowBlur = 30;
                ctx.fillRect(marginX - 20, marginYTop - 20, photoW + 40, photoH + 200);
                ctx.shadowColor = "transparent"; // Reset shadow

                // Viền đứt nét mỏng bên trong
                ctx.strokeStyle = '#ffb7c5';
                ctx.lineWidth = 6;
                ctx.setLineDash([15, 15]);
                ctx.strokeRect(marginX - 10, marginYTop - 10, photoW + 20, photoH + 180);
                ctx.setLineDash([]);

                // 3. Đổ ảnh mặt người dùng vào khung
                ctx.drawImage(img, marginX, marginYTop, photoW, photoH);

                // Viền đen/hồng bao quanh tấm ảnh chụp
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 4;
                ctx.strokeRect(marginX, marginYTop, photoW, photoH);

                // 4. Viết Text Footer
                ctx.fillStyle = '#df2b76';
                ctx.font = "900 65px 'Quicksand', sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const textY = marginYTop + photoH + 85;
                ctx.fillText('Hello Kitty Photobooth', CANVAS_W / 2, textY);

                // 5. Vẽ Logo Vector Hello Kitty (Trái góc trên & Phải góc dưới)
                drawKittyVector(ctx, 160, 140, 1.2);
                drawKittyVector(ctx, CANVAS_W - 140, textY, 0.8);

                // Đưa ra UI
                resultImg.src = canvas.toDataURL('image/jpeg', 0.95);
                video.style.display = 'none';
                msg.style.display = 'none';
                resultImg.style.display = 'block';
                
                startBtn.style.display = 'none';
                resultControls.style.display = 'flex';
                resolve();
            };
            img.src = base64Src;
        });
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = resultImg.src;
        link.download = `Photobooth_HelloKitty_${Date.now()}.jpg`;
        link.click();
    });

    document.getElementById('retakeBtn').addEventListener('click', () => {
        window.location.reload();
    });
</script>

</body>
</html>
